global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"

  - job_name: "t1-java-app"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["localhost:8085"]
        labels:
          app: "t1-java-app"
          env: "development"
    scrape_interval: 15s
    scrape_timeout: 10s